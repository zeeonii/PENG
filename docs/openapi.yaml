openapi: 3.0.3
info:
  title: Borderless Teamwork with AI - API
  description: AI 팀원이 회의/문서를 기억해 시차로 끊긴 팀의 맥락을 이어주는 협업 플랫폼 API
  version: 0.1.0
servers:
  - url: /

tags:
  - name: accounts
  - name: projects
  - name: briefings
  - name: qna
  - name: translation
  - name: messages
  - name: integrations

paths:
  /accounts/oauth/google:
    get:
      tags: [accounts]
      summary: Google 로그인
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /accounts/logout:
    post:
      tags: [accounts]
      summary: 로그아웃
      responses:
        '204':
          description: 로그아웃 성공

  /accounts/me:
    get:
      tags: [accounts]
      summary: 내 정보 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
    patch:
      tags: [accounts]
      summary: 프로필 수정 (언어/시간대/담당업무)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /projects:
    get:
      tags: [projects]
      summary: 프로젝트 목록 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags: [projects]
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /projects/{projectId}:
    get:
      tags: [projects]
      summary: 프로젝트 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /projects/{projectId}/members:
    get:
      tags: [projects]
      summary: 프로젝트 팀원 목록 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
    post:
      tags: [projects]
      summary: 프로젝트 팀원 초대
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberInviteRequest'
      responses:
        '201':
          description: 초대 성공

  /projects/{projectId}/members/{memberId}:
    delete:
      tags: [projects]
      summary: 프로젝트 팀원 삭제
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공

  /projects/{projectId}/briefings/today:
    get:
      tags: [briefings]
      summary: 오늘의 브리핑 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Briefing'

  /projects/{projectId}/briefings/{briefingId}:
    get:
      tags: [briefings]
      summary: 브리핑 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: briefingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Briefing'

  /projects/{projectId}/qna:
    post:
      tags: [qna]
      summary: 질문 전송 및 답변 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QnaRequest'
      responses:
        '200':
          description: 답변 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QnaResponse'

  /projects/{projectId}/qna/history:
    get:
      tags: [qna]
      summary: 대화 히스토리 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QnaResponse'

  /translation:
    post:
      tags: [translation]
      summary: 메시지 변환 요청 (한국어-영어)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequest'
      responses:
        '200':
          description: 변환 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponse'

  /messages:
    get:
      tags: [messages]
      summary: 쪽지 목록 조회 (받은/보낸)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      tags: [messages]
      summary: 쪽지 전송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '201':
          description: 전송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /messages/{messageId}/read:
    patch:
      tags: [messages]
      summary: 쪽지 읽음 처리
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 읽음 처리 성공

  /integrations/notion:
    post:
      tags: [integrations]
      summary: Notion 연동 시작
      responses:
        '200':
          description: 연동 시작 성공

  /integrations/google-meet:
    post:
      tags: [integrations]
      summary: Google Meet 연동 시작
      responses:
        '200':
          description: 연동 시작 성공

  /integrations/status:
    get:
      tags: [integrations]
      summary: 연동 상태 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationStatus'

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Member:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        language:
          type: string
          enum: [KR, EN]
        country:
          type: string
        timezone:
          type: string
        duty:
          type: string

    MemberUpdateRequest:
      type: object
      properties:
        language:
          type: string
          enum: [KR, EN]
        country:
          type: string
        timezone:
          type: string
        duty:
          type: string

    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    ProjectMember:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
        country:
          type: string
        timezone:
          type: string

    ProjectMemberInviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        role:
          type: string

    Briefing:
      type: object
      properties:
        id:
          type: integer
          format: int64
        summary:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        createdAt:
          type: string
          format: date-time

    DocumentRef:
      type: object
      properties:
        documentId:
          type: integer
          format: int64
        title:
          type: string
        sourceUrl:
          type: string

    QnaRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string

    QnaResponse:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        createdAt:
          type: string
          format: date-time

    TranslationRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        senderLanguage:
          type: string
          enum: [KR, EN]
        receiverLanguage:
          type: string
          enum: [KR, EN]

    TranslationResponse:
      type: object
      properties:
        original:
          type: string
        translated:
          type: string

    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        originalText:
          type: string
        translatedText:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MessageCreateRequest:
      type: object
      required: [projectId, receiverId, originalText]
      properties:
        projectId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        originalText:
          type: string

    IntegrationStatus:
      type: object
      properties:
        type:
          type: string
          enum: [NOTION, GOOGLE_MEET]
        status:
          type: string
          enum: [CONNECTED, DISCONNECTED]
        lastSyncedAt:
          type: string
          format: date-time
