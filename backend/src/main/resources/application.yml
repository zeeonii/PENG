spring:
  application:
    name: sixpeng
  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:sixpeng}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

openai:
  api-key: ${OPENAI_API_KEY}

chroma:
  base-url: http://localhost:8000