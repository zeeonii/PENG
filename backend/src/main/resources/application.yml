spring:
  application:
    name: sixpeng
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sixpeng?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme}
            # openid 를 넣으면 OIDC 경로를 타므로 CustomOAuth2UserService 가 호출되지 않는다.
            scope:
              - profile
              - email

server:
  # Railway 등 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 신뢰하지 않으면, 프록시가 https로
  # 받은 요청도 컨테이너 내부에는 http로 전달되어 OAuth redirect_uri가 http://로 잘못 생성된다.
  # prod 프로파일이 아니어도 적용돼야 하므로 기본 문서에 둔다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # 프론트가 다른 사이트에 배포돼도 세션 쿠키가 실리도록 None 으로 둔다.
        # None 은 Secure 를 요구하며, SameSite 방어가 사라지므로 CSRF 토큰이 반드시 켜져 있어야 한다.
        same-site: none
        secure: true

# 배포 확인용. health/info 만 열고 나머지 엔드포인트(env, beans, heapdump 등)는 닫아 둔다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 상세를 켜면 DB 접속 정보 등이 노출되므로 상태만 내려준다.
      show-details: never
  info:
    build:
      enabled: true
    java:
      enabled: true
    env:
      enabled: true

# 이미지 빌드 시점에 Dockerfile 의 GIT_COMMIT/GIT_BRANCH 빌드 인자로 박힌다(docker-compose.yml 참고).
# 배포된 인스턴스가 어느 커밋인지 /actuator/info 로 바로 확인할 수 있다.
# 로컬에서 직접 실행하면 unknown 으로 뜬다.
info:
  deployment:
    commit: ${DEPLOY_COMMIT:unknown}
    branch: ${DEPLOY_BRANCH:unknown}

app:
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/auth/callback}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login?error=oauth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://peng-527.pages.dev}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

openai:
  base-url: https://api.openai.com/v1
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

notion:
  client-id: ${NOTION_CLIENT_ID:}
  client-secret: ${NOTION_CLIENT_SECRET:}
  redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/integrations/notion/callback}
  authorize-uri: https://api.notion.com/v1/oauth/authorize
  token-uri: https://api.notion.com/v1/oauth/token

google-meet:
  redirect-uri: ${GOOGLE_MEET_REDIRECT_URI:http://localhost:8080/integrations/google-meet/callback}
  authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
  token-uri: https://oauth2.googleapis.com/token

chroma:
  base-url: ${CHROMA_BASE_URL:http://localhost:8000}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
