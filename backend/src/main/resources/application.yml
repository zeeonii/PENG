spring:
  application:
    name: sixpeng
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sixpeng?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme}
            # openid 를 넣으면 OIDC 경로를 타므로 CustomOAuth2UserService 가 호출되지 않는다.
            scope:
              - profile
              - email

server:
  servlet:
    session:
      cookie:
        http-only: true
        # 프론트가 다른 사이트에 배포돼도 세션 쿠키가 실리도록 None 으로 둔다.
        # None 은 Secure 를 요구하며, SameSite 방어가 사라지므로 CSRF 토큰이 반드시 켜져 있어야 한다.
        same-site: none
        secure: true

app:
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth/callback}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login?error=oauth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
