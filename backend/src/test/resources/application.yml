spring:
  application:
    name: sixpeng

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

google:
  translate:
    base-url: https://translation.googleapis.com/language/translate/v2
    api-key: test-key

notion:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:8080/integrations/notion/callback
  authorize-uri: https://api.notion.com/v1/oauth/authorize
  token-uri: https://api.notion.com/v1/oauth/token

app:
  frontend-url: http://localhost:5173
