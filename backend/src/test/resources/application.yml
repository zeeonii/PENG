spring:
  application:
    name: sixpeng
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/sixpeng_test?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - profile
              - email

app:
  oauth2:
    success-redirect-uri: http://localhost:5173/oauth/callback
    failure-redirect-uri: http://localhost:5173/login?error=oauth
  cors:
    allowed-origins: http://localhost:5173
  frontend-url: http://localhost:5173

openai:
  base-url: https://api.openai.com/v1
  api-key: test-key
  model: gpt-4o-mini

notion:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:8080/integrations/notion/callback
  authorize-uri: https://api.notion.com/v1/oauth/authorize
  token-uri: https://api.notion.com/v1/oauth/token
